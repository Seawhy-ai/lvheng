<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>律衡 · 全民法律知识普惠智能体</title>

<meta name="theme-color" content="#1a5276">
<script>
/* 根地址直接进入引擎主页（选角色在主页完成）；保留查询参数与 hash */
location.replace("law.html" + location.search + location.hash);

<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#f2f7fc,#e8f0f8);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;color:#1a5276}
.box{text-align:center;padding:40px 24px}
.box .whale{font-size:56px;display:block;animation:float 2.4s ease-in-out infinite}
.box p{margin:14px 0 22px;font-size:14px;color:#5b7288;letter-spacing:1px}
.box a{display:inline-block;margin:0 8px;padding:10px 20px;border-radius:22px;font-size:14px;font-weight:700;text-decoration:none}
.box .go{background:#1a5276;color:#fff}
.box .gate{color:#1a5276;border:1.5px solid #1a5276}

</style>
</head>
<body>
<div class="box">
  <span class="whale">🐋</span>

  <noscript>

<script>
/* JS 可用时上面的跳转已生效；这里兜底 800ms 后强跳 */
setTimeout(function(){ if (location.pathname.indexOf("law.html") < 0) location.replace("law.html"); }, 800);
</script>
