<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>律衡 · 法律素养教学管理平台</title>
<meta name="description" content="教师发布法律情境任务，学生完成训练，系统形成真实学情与五维能力报告。">
<meta name="theme-color" content="#1665d8">
<script>
/* 根地址直接进入引擎主页（选角色在主页完成）；保留查询参数与 hash */
location.replace("classroom.html" + location.search + location.hash);
</script>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#f4f7fc,#eaf2ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;color:#1665d8}
.box{text-align:center;padding:40px 24px}
.box .whale{font-size:56px;display:block;animation:float 2.4s ease-in-out infinite}
.box p{margin:14px 0 22px;font-size:14px;color:#586f92;letter-spacing:1px}
.box a{display:inline-block;margin:0 8px;padding:10px 20px;border-radius:22px;font-size:14px;font-weight:700;text-decoration:none}
.box .go{background:#1665d8;color:#fff}
.box .gate{color:#1665d8;border:1.5px solid #1665d8}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
<link rel="stylesheet" href="brand-blue.css?v=20261026-blue1"></head>
<body>
<div class="box">
  <span class="whale">🐋</span>
  <p>正在进入律衡教学空间…</p>
  <noscript>
    <a class="go" href="classroom.html">进入教学空间</a>
    <a class="gate" href="law.html">公众学习工具</a>
  </noscript>
  <div style="margin-top:18px">
    <a class="gate" href="classroom.html" style="font-size:12px;opacity:.85">若未自动跳转，点此进入</a>
  </div>
</div>
<script>
/* JS 可用时上面的跳转已生效；这里兜底 800ms 后强跳 */
setTimeout(function(){ if (location.pathname.indexOf("classroom.html") < 0) location.replace("classroom.html"); }, 800);
</script>
</body>
</html>
