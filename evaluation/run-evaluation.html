<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>律衡·独立场景评测</title><style>body{font-family:system-ui;margin:0;background:#f4f7fa;color:#243447}.wrap{max-width:900px;margin:auto;padding:24px}.hero,.card{background:#fff;border:1px solid #dce5ec;border-radius:16px;padding:20px;margin-bottom:14px}.score{font-size:38px;font-weight:900;color:#176847}.bad{color:#b33232}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px;border-bottom:1px solid #e4e9ee;text-align:left}</style></head><body><main class="wrap"><section class="hero"><h1>律衡·独立场景评测</h1><p>评测数据与生产知识库分离。当前基线测试105种自然语言表达的领域识别结果。</p><div id="score"></div></section><section class="card"><table><thead><tr><th>ID</th><th>文本</th><th>期望</th><th>实际</th><th>结果</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="scenario-dataset.js"></script><script>
var RULES={labor:"拖欠工资 欠薪 讨薪 工资 辞退 开除 裁员 解除 不用来上班 劳动合同 实习 工伤 社保 加班 五险一金 劳动仲裁 劳动监察",consumer:"假货 退款 退货 退一赔三 七天无理由 网购 商家 欺诈 保修 三包 预付卡 跑路",rent:"租房 房东 租客 押金 退租 转租 中介 房租 甲醛 涨租",loan:"借钱 借给 借款 借条 欠条 民间借贷 利息 还钱 不还 讨债 高利贷 转账",traffic:"交通事故 车祸 全责 碰撞 追尾 保险 理赔 误工费 电动车",marriage:"离婚 抚养 抚养费 彩礼 婚内财产 家暴 共同财产 保护令",criminal:"诈骗 抢劫 抢走 持刀 盗窃 故意伤害 敲诈 勒索 刑事 犯罪 报警 被骗"};
function detect(t){var b=null,n=0;Object.keys(RULES).forEach(function(k){var s=RULES[k].split(" ").filter(function(w){return t.indexOf(w)>=0}).length;if(s>n){n=s;b=k}});return b}var pass=0,rows="";LVHENG_EVAL_DATA.forEach(function(x){var a=detect(x.text),ok=a===x.domain;if(ok)pass++;rows+="<tr><td>"+x.id+"</td><td>"+x.text+"</td><td>"+x.domain+"</td><td>"+(a||"null")+"</td><td>"+(ok?"✓":"✗")+"</td></tr>"});var pct=Math.round(pass/LVHENG_EVAL_DATA.length*1000)/10;document.getElementById("score").innerHTML='<span class="score '+(pct<95?'bad':'')+'">'+pct+'%</span>　'+pass+'/'+LVHENG_EVAL_DATA.length+' 通过';document.getElementById("rows").innerHTML=rows;
</script></body></html>
